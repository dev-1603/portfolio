name: Build and Deploy to dev-1603.github.io

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ./build.db
      GITHUB_PAGES: true
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Clean
        run: |
          rm -rf node_modules
          rm -rf .svelte-kit
          rm -rf build

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build
        run: pnpm run build

      - name: Resolve publish directory
        id: resolve_publish
        run: |
          if [ -d build ]; then
            echo "PUBLISH_DIR=build" >> "$GITHUB_ENV"
            echo "publish_dir=build" >> "$GITHUB_OUTPUT"
          elif [ -d .vercel/output/static ]; then
            echo "PUBLISH_DIR=.vercel/output/static" >> "$GITHUB_ENV"
            echo "publish_dir=.vercel/output/static" >> "$GITHUB_OUTPUT"
          else
            echo "No deployable static output found (build or .vercel/output/static)."
            exit 1
          fi

      - name: Validate publish directory
        run: |
          echo "Using publish directory: $PUBLISH_DIR"
          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "Publish directory '$PUBLISH_DIR' does not exist."
            exit 1
          fi

      - name: Fix SPA refresh (404 → fallback)
        run: |
          if [ -f "$PUBLISH_DIR/200.html" ]; then
            cp "$PUBLISH_DIR/200.html" "$PUBLISH_DIR/404.html"
          elif [ -f "$PUBLISH_DIR/index.html" ]; then
            cp "$PUBLISH_DIR/index.html" "$PUBLISH_DIR/404.html"
          else
            echo "No 200.html/index.html found in $PUBLISH_DIR. Skipping fallback copy."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: dev-1603/dev-1603.github.io
          publish_branch: main
          publish_dir: ./${{ steps.resolve_publish.outputs.publish_dir }}
          force_orphan: true
          commit_message: "Deploy from portfolio-website - ${{ github.sha }}"
